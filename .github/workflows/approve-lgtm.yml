name: Approve PR and Add LGTM Label

on:
  issue_comment:
    types: [created]

jobs:
  approve_and_label:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request != null

    steps:
      - name: Check if comment is /lgtm
        id: lgtm_check
        run: |
          if [[ "${{ github.event.comment.body }}" == "/lgtm" ]]; then
            echo "lgtm=true" >> $GITHUB_ENV
          else
            echo "lgtm=false" >> $GITHUB_ENV
          fi

      - name: Approve the pull request
        if: env.lgtm == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/reviews" \
            -d '{"event": "APPROVE"}'

      - name: Add LGTM label
        if: env.lgtm == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels" \
            -d '{"labels": ["LGTM"]}'
