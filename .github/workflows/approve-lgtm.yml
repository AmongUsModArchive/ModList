name: Approve PR and Add LGTM Label

on:
  issue_comment:
    types: [created]

jobs:
  approve_and_label:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request != null

    steps:
      - name: Check if commenter is a member of AmongUsModArchive and comment is /lgtm
        id: lgtm_check
        run: |
          COMMENTER="${{ github.event.comment.user.login }}"
          ORG="AmongUsModArchive"
          COMMENT_BODY="${{ github.event.comment.body }}"

          # Check if the comment is "/lgtm" and the user is a member of the organization
          if [[ "$COMMENT_BODY" == "/lgtm" ]]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/$ORG/members/$COMMENTER")
            if [ "$STATUS" -eq 204 ]; then
              echo "lgtm=true" >> $GITHUB_ENV
            else
              echo "Commenter is not a member of $ORG"
              echo "lgtm=false" >> $GITHUB_ENV
            fi
          else
            echo "Comment is not /lgtm"
            echo "lgtm=false" >> $GITHUB_ENV
          fi

      - name: Approve the pull request
        if: env.lgtm == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/reviews" \
            -d '{"event": "APPROVE"}'

      - name: Add LGTM label
        if: env.lgtm == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels" \
            -d '{"labels": ["LGTM"]}'
